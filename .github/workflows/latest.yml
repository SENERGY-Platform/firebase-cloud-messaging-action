name: 'Docker Image'

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Builds each platform on a native runner of its own, arm64 without QEMU, and merges
  # both into one manifest under the tag below. action.yml runs this image as a Docker
  # container action.
  multi:
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write # signs the provenance attestation
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      meta-images: |
        ghcr.io/senergy-platform/firebase-cloud-messaging-action
      meta-tags: |
        type=raw,value=latest
      meta-flavor: |
        latest=false
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}
